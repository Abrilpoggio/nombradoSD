services:
  inventory-service:
    build: ./InventoryService
    ports:
      - "8080:8080"
    networks:
      - ecommerce-network

  orders-service:
    build: ./OrdersService
    depends_on:
      - inventory-service
    ports:
      - "8081:8080"
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge
